name: DB 백업

# 매일 새벽 4시(한국 시간)에 운영 D1 을 통째로 내보내 암호로 잠근 뒤 아티팩트로 90일 보관합니다.
# 공개 저장소라 덤프는 반드시 암호화한 파일만 올립니다. 원문 SQL 은 러너에서 바로 지웁니다.
# 저장소 Settings › Secrets › Actions 에 세 값이 있어야 돕니다. 없으면 건너뜁니다(실패로 남지 않음).
#   CLOUDFLARE_API_TOKEN   D1 Edit 권한 토큰
#   CLOUDFLARE_ACCOUNT_ID
#   BACKUP_PASSPHRASE      복호화: openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in X.sql.enc -out X.sql
on:
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = KST 04:00
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 설정 확인
        id: cfg
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          P: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ] && [ -n "$P" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::백업 시크릿이 아직 없어 건너뜁니다"; echo "ok=0" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == '1'
        with:
          node-version: 22

      - name: 내보내기
        if: steps.cfg.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 export wedding-management --remote --output=dump.sql

      - name: 제대로 나왔는지 확인
        if: steps.cfg.outputs.ok == '1'
        run: |
          SIZE=$(wc -c < dump.sql)
          if [ "$SIZE" -lt 2000 ]; then echo "::error::덤프가 너무 작습니다"; rm -f dump.sql; exit 1; fi
          for T in users plans plan_members vendors payments files; do
            grep -q "CREATE TABLE .*\"\?${T}\"\?" dump.sql || { echo "::error::${T} 테이블이 없습니다"; rm -f dump.sql; exit 1; }
          done
          echo "### 백업 완료 · $(( SIZE / 1024 )) KB" >> "$GITHUB_STEP_SUMMARY"

      - name: 암호로 잠그기
        if: steps.cfg.outputs.ok == '1'
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt \
            -in dump.sql -out "wedding-$(date -u +%Y%m%d).sql.enc" -pass env:PASS
          rm -f dump.sql

      - name: 올려두기
        if: steps.cfg.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: '*.sql.enc'
          retention-days: 90
