<meta charset="utf-8">

<title>Wedding Management 인트로</title>
<style>
/* 레이아웃: 한 화면. 가운데 무대 하나, 아래에 재생 컨트롤. 이미지 배경색(크림)에 맞춘 단일 테마. */
:root{
  --bg:#FAF5EC;
  --ink:#3A2E2E;
  --mute:#9A8A86;
  --pink:#E8536F;
  --line:rgba(232,83,111,.25);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding-inline:16px;padding-block:24px;box-sizing:border-box;overflow:hidden}
.stage{position:relative;width:min(960px,100%);aspect-ratio:16/9;max-width:100%}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;mix-blend-mode:darken}

/* 1) 레터링: 왼쪽에서 오른쪽으로 써지듯 드러남 */
.word{opacity:0;transform:scale(.96);
  -webkit-mask-image:linear-gradient(90deg,#000 0 40%,transparent 60%);mask-image:linear-gradient(90deg,#000 0 40%,transparent 60%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-position:100% 0;mask-position:100% 0}
.play .word{animation:
  write 2.1s cubic-bezier(.4,0,.2,1) .2s forwards,
  gather 1.2s cubic-bezier(.6,0,.4,1) 3s forwards}
@keyframes write{
  0%{opacity:1;transform:scale(.96);-webkit-mask-position:100% 0;mask-position:100% 0}
  100%{opacity:1;transform:scale(1);-webkit-mask-position:0% 0;mask-position:0% 0}}
@keyframes gather{
  0%{opacity:1;transform:scale(1);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-position:0 0;mask-position:0 0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 0,#000 100%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 0,#000 100%,transparent 100%)}
  100%{opacity:0;transform:scale(.92);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-position:0 0;mask-position:0 0;-webkit-mask-image:linear-gradient(90deg,transparent 46%,#000 50%,#000 50%,transparent 54%);mask-image:linear-gradient(90deg,transparent 46%,#000 50%,#000 50%,transparent 54%)}}

/* 2) 로고: 자르지 않고 한 장. 가운데 반지에서 양쪽으로 리본이 풀려 나오듯 드러남 */
.logo{opacity:0;transform:scale(.94);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:50% 0;mask-position:50% 0;-webkit-mask-size:0% 100%;mask-size:0% 100%}
.play .logo{animation:unfurl 1.9s cubic-bezier(.3,.6,.15,1) 3.6s forwards}
@keyframes unfurl{
  0%{opacity:0;transform:scale(.94);-webkit-mask-size:0% 100%;mask-size:0% 100%}
  12%{opacity:1}
  100%{opacity:1;transform:none;-webkit-mask-size:150% 100%;mask-size:150% 100%}}

/* 3) 마무리: 작은 워드마크가 로고 아래로 */
.tag{width:min(34%,300px);margin-top:-2%;transform:translateY(10px);opacity:0;mix-blend-mode:darken}
.tag img{width:100%;height:auto;display:block}
body.play .tag{animation:settle .9s ease 5.4s forwards}
@keyframes settle{to{opacity:1;transform:none}}

/* 완성 상태 (reduced motion 또는 재생 전) */
.done .word{opacity:0}
.done .logo{opacity:1;transform:none;-webkit-mask-size:150% 100%;mask-size:150% 100%}
body.done .tag{opacity:1;transform:none}

.bar{display:flex;gap:10px;align-items:center;margin-top:40px;color:var(--mute);font-size:12px;letter-spacing:.02em}
.bar button{font:inherit;font-weight:600;color:var(--pink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.bar button:hover{background:rgba(232,83,111,.06)}
.bar button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.bar span{font-variant-numeric:tabular-nums}
@media (max-width:600px){.bar{margin-top:24px}.tag{width:48%}}
@media (prefers-reduced-motion:reduce){.play *,body.play .tag{animation:none!important}}
</style>
