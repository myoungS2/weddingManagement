<title>Wedding Management</title>
<style>
/* Wedding Management · © 2026 myoung. All rights reserved. */
/* 팔레트는 로고에서: 크림 종이 위에 리본 핑크. 장식(블러·그레인·그라디언트 덩어리)은 쓰지 않고
   둥근 모서리, 연한 핑크 면, 따뜻한 회색 선으로 분위기를 낸다. 숫자는 고정폭. 매일 열어 금액을 적는 도구. */
:root{
  --bg:#FBF7F0;--bg2:#F6EFE6;--surface:#FFFFFF;--ink:#3A2A2E;--ink2:#5E4A50;--muted:#9C868C;--line:#F0E4E2;--line2:#E3CFD0;
  --pink:#E8536F;--pink2:#F4A0B0;--pink-ink:#C23A55;--pink-soft:#FDECEF;--pink-mist:#FBF1F2;
  --good:#3C8A5E;--good-soft:#E8F4EC;--warn:#B8740A;--warn-soft:#FFF3DF;--bad:#B3261E;--bad-soft:#FBE9E8;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --r:14px;--rs:9px;--nav:66px;--shadow:0 1px 2px rgba(120,60,70,.05),0 6px 20px -14px rgba(232,83,111,.25);
  color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--pink-ink)}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ── 셸: 모바일은 하단 탭, 넓은 화면은 왼쪽 사이드바 ── */
.app{min-height:100%;display:flex;flex-direction:column}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding:6px 6px env(safe-area-inset-bottom,0px);
  background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px -18px rgba(120,60,70,.35);display:flex;gap:4px;z-index:20}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:500;border-radius:12px;transition:background .15s,color .15s;min-width:0;padding:0 2px}
nav.tabs button svg{display:none}
nav.tabs button img{width:30px;height:30px;object-fit:contain;filter:grayscale(1) opacity(.55);transition:filter .15s,transform .15s}
nav.tabs button[aria-current="page"]{color:var(--pink-ink);background:var(--pink-soft);font-weight:600}
nav.tabs button[aria-current="page"] img{filter:none;transform:scale(1.08)}
nav.tabs .brand,nav.tabs .spacer,nav.tabs .me,nav.tabs .by{display:none}
main{flex:1;padding:16px 16px calc(var(--nav) + 24px + env(safe-area-inset-bottom,0px));max-width:1080px;width:100%;margin:0 auto;min-width:0}
/* 좁은 화면에서는 사이드바가 없어 브랜드가 사라진다. 상단에 워드마크 띠 하나. 누르면 인트로를 다시 본다. */
.mbrand{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.mbrand img{height:30px;width:auto;display:block}
@media (min-width:900px){.mbrand{display:none}}
header.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
header.ph h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
header.ph .sub{font-size:12px;color:var(--muted)}
.segs{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px}
.segs button{padding:6px 13px;font-size:13px;color:var(--muted);font-weight:500;border-radius:999px;white-space:nowrap;transition:background .15s,color .15s}
.segs button[aria-pressed="true"]{background:var(--surface);color:var(--pink-ink);font-weight:600;box-shadow:var(--shadow)}
@media (min-width:900px){
  .app{flex-direction:row}
  nav.tabs{position:sticky;top:0;bottom:auto;height:100vh;width:212px;flex-direction:column;border-top:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none;background:var(--bg);padding:22px 12px;gap:3px;flex-shrink:0}
  nav.tabs .brand,nav.tabs .spacer,nav.tabs .me,nav.tabs .by{display:block}
  nav.tabs .by{font-size:10.5px;color:var(--muted);padding:2px 12px 0;opacity:.7;letter-spacing:.04em}
  nav.tabs .brand{padding:4px 10px 18px}
  nav.tabs .brand img{width:120px;height:auto;display:block}
  nav.tabs button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:11px;font-size:14px;padding:8px 12px;border-radius:12px}
  nav.tabs button img{width:34px;height:34px}
  nav.tabs button:hover{background:var(--pink-mist)}
  nav.tabs button[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow)}
  nav.tabs .spacer{flex:1}
  nav.tabs .me{font-size:12px;color:var(--muted);padding:8px 10px;word-break:break-all}
  main{padding:28px 32px 48px}
}

/* ── 공통 ── */
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.right{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--pink-mist);border-color:var(--pink2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 14px -6px rgba(232,83,111,.6)}
.btn.primary:hover{background:var(--pink-ink);border-color:var(--pink-ink)}
.btn.ghost{border-color:transparent;color:var(--pink-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap;line-height:1.5;background:var(--surface)}
.pill.contracted{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.candidate{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.dropped{color:var(--muted);text-decoration:line-through}
.pill.pink{background:var(--pink-soft);color:var(--pink-ink);border-color:transparent}
.pill.dim{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface);box-shadow:var(--shadow)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.sect{margin-top:26px}
.sect h2{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.sect h2 .sub{font-size:12px;color:var(--muted);font-weight:400}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;border:1.5px dashed var(--pink2);border-radius:var(--r);background:var(--pink-mist)}
.empty img{height:96px;width:auto;display:block;margin:0 auto 8px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:11.5px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--pink-mist)}
tr.sum td{font-weight:600;border-top:1px solid var(--line2);border-bottom:0}
.tbl{overflow-x:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.tbl table th:first-child,.tbl table td:first-child{position:sticky;left:0;background:var(--bg);white-space:nowrap;z-index:1}
.tbl table tr.click:hover td:first-child{background:var(--pink-mist)}
@media (min-width:900px){.tbl{margin:0;padding:0}}
.gauge{height:8px;background:var(--pink-soft);border-radius:999px;overflow:hidden;margin:8px 0 5px}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--pink2),var(--pink));border-radius:999px;transition:width .4s ease}
.gauge.over i{background:var(--bad)}
.line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.strike{text-decoration:line-through;color:var(--muted)}
.chk{width:16px;height:16px;accent-color:var(--pink);cursor:pointer;flex:none}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it .t{flex:1;min-width:0}
.list .it .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .t small{color:var(--muted);font-size:12px}
.list .it.done .t b{text-decoration:line-through;color:var(--muted)}
.dd{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--pink-ink)}
.dd small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:4px;letter-spacing:0}
.stage{display:inline-block;margin-top:6px}
.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .doves{position:absolute;right:4px;top:50%;transform:translateY(-50%);height:112px;width:auto;pointer-events:none}
.hero{min-height:136px}
.hero .doves.couple{right:14px;top:10px;bottom:10px;height:auto;max-height:calc(100% - 20px);transform:none}
@media (max-width:480px){.hero .doves.couple{right:6px}.hero .in{max-width:calc(100% - 96px)}}
.hero .in{position:relative;max-width:calc(100% - 150px)}
@media (max-width:480px){.hero .doves{height:84px;right:-10px}.hero .in{max-width:calc(100% - 100px)}}
.card h2.ct{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--pink-ink)}
.sect h2::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-right:8px;vertical-align:middle;position:relative;top:-1px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line2);border-radius:var(--rs);background:var(--surface);width:100%;font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input,.inline select{padding:8px 10px;border:1px solid var(--line2);border-radius:var(--rs);font-size:14px;min-width:0;background:var(--surface)}
.sub-list{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.sub-list h4{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sub-list h4 .right{font-weight:400;color:var(--muted);font-size:12px}
.x{color:var(--muted);padding:4px 6px;border-radius:4px;font-size:16px;line-height:1}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.filters button{padding:5px 12px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px;color:var(--muted);background:var(--surface)}
.filters button[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.notice{padding:10px 14px;border-radius:var(--rs);background:var(--warn-soft);color:var(--warn);font-size:13px;margin-bottom:12px}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

/* 결제 행: 종류 · 금액 · 날짜 · 결제자 · 수단 · 메모 */
.pays{display:flex;flex-direction:column;gap:6px}
.pay{display:grid;grid-template-columns:76px 1fr 1fr;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:var(--rs);background:var(--bg)}
.pay.new{border-style:dashed;border-color:var(--pink2);margin-top:8px;background:var(--pink-mist)}
.pay select,.pay input{padding:6px 8px;border:1px solid var(--line2);border-radius:6px;font-size:13px;min-width:0;width:100%;background:var(--bg)}
.pay .pmemo{grid-column:1 / 3}
.pay .x{grid-column:3}
.pay input[type=checkbox]{width:16px;padding:0}
.pay .pchk{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.pay.done .pchk{color:var(--good)}
.pay .x{justify-self:end}
@media (min-width:900px){.pay{grid-template-columns:76px 110px 100px 120px 96px 88px 1fr auto}.pay .pmemo,.pay .x{grid-column:auto}.pay.new{grid-template-columns:110px 100px 120px 96px 88px 1fr auto}}
/* 시트: 넓으면 오른쪽, 좁으면 아래에서 */
#scrim{position:fixed;inset:0;background:rgba(80,40,50,.32);z-index:30}
#sheet{position:fixed;z-index:31;background:var(--surface);display:flex;flex-direction:column;
  left:0;right:0;bottom:0;max-height:92vh;border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(120,60,70,.18)}
#sheet .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--pink-mist)}
#sheet .hd h3{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .bd{overflow:auto;padding:16px;flex:1}
#sheet .ft{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
@media (min-width:900px){#sheet{left:auto;top:0;bottom:0;width:min(520px,100%);max-height:none;border-radius:0;box-shadow:-4px 0 30px rgba(0,0,0,.1)}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pink-ink);color:#fff;
  font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
@media (min-width:900px){#toast{bottom:24px}}

/* 월간 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:12px}
.cal .dow{text-align:center;color:var(--muted);padding:4px 0}
.cal .d{min-height:58px;border:1px solid var(--line);border-radius:8px;padding:3px 4px;font-size:11.5px;color:var(--muted);background:var(--surface)}
.cal .d.today{border-color:var(--pink)}
.cal .d.other{opacity:.35}
.cal .d .n{font-weight:500;color:var(--ink)}
.cal .d .ev{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;padding:0 3px;border-radius:3px;margin-top:2px;color:var(--ink)}
.cal .d .ev.pay{background:var(--warn-soft);color:var(--warn)}
.cal .d .ev.guide{background:var(--bg2)}
.cal .d .ev.fixed{background:var(--pink-soft);color:var(--pink-ink)}
.cal .d .ev.wed{background:var(--pink);color:#fff}

/* 식순 */
.steps .it{align-items:flex-start}
.steps .tm{width:52px;font-weight:600;flex:none}
.steps .mn{color:var(--muted);font-size:12px;width:48px;text-align:right;flex:none}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.att a{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border:1px solid var(--line2);border-radius:999px;text-decoration:none;color:var(--ink2);max-width:100%}
.att a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}

/* 레퍼런스 */
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ref{position:relative;border-radius:var(--r);overflow:hidden;background:var(--bg2);aspect-ratio:3/4;cursor:pointer;border:1px solid var(--line);box-shadow:var(--shadow)}
.ref img{width:100%;height:100%;object-fit:cover;display:block}
.ref .lk{position:absolute;right:6px;top:6px;background:rgba(255,255,255,.9);border-radius:999px;padding:2px 7px;font-size:12px}
.ref .wh{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink2)}
.ref .wh.bride{color:var(--pink-ink)}.ref .wh.groom{color:#3F5F8A}
.filters.who{margin-bottom:6px}
.ref .tg{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#show{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center}
#show{touch-action:none;user-select:none;-webkit-user-select:none}
#show img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:auto;-webkit-user-drag:none}
#show .hint{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:999px;animation:hintout .6s ease 2.4s forwards}
@keyframes hintout{to{opacity:0;visibility:hidden}}
#show .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));color:#fff;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
#show .cl{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;color:#fff;font-size:26px;padding:6px 10px}
#show .nv{position:absolute;top:0;bottom:0;width:30%}
#show .nv.l{left:0}#show .nv.r{right:0}

/* 홈의 비둘기 도우미: 사용 안내 입구. 접어두기 / 다시 보지 않기 */
#helper{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));z-index:22}
@media (min-width:900px){#helper{right:28px;bottom:28px}}
#helper .hc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;width:min(300px,calc(100vw - 32px));box-shadow:0 12px 36px -14px rgba(120,60,70,.45);position:relative}
#helper .hc img{height:64px;width:auto;display:block;margin:-30px auto 4px}
#helper .hc b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
#helper .hc p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:10px}
#helper .hc .row{gap:6px}
#helper .hc .x{position:absolute;right:6px;top:6px}
#helper .mini{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px -10px rgba(120,60,70,.5);display:flex;align-items:center;justify-content:center;padding:0;animation:bob 3s ease-in-out infinite}
#helper .mini img{height:40px;width:auto}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){#helper .mini{animation:none}}
/* 사용 안내: 실제 화면 위에 스포트라이트 · 손가락 포인터 · 말풍선 */
#guide{position:fixed;inset:0;z-index:45}
#guide .spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(80,40,50,.45),0 0 0 3px var(--pink);transition:top .35s ease,left .35s ease,width .35s ease,height .35s ease;pointer-events:none}
#guide .hand{position:fixed;width:34px;height:34px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));animation:tap 1.1s ease-in-out infinite;transition:top .35s ease,left .35s ease}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,-7px) scale(.94)}}
#guide .tip{position:fixed;width:min(340px,calc(100vw - 24px));background:var(--surface);border-radius:16px;padding:16px 16px 14px;box-shadow:0 10px 40px -10px rgba(80,40,50,.45);transition:top .3s ease,left .3s ease}
#guide .tip::before{content:"";position:absolute;width:14px;height:14px;background:var(--surface);transform:rotate(45deg);left:var(--ax,28px)}
#guide .tip.below::before{top:-7px}#guide .tip.above::before{bottom:-7px}

<script>
/* Wedding Management · © 2026 myoung. All rights reserved. */
(function(){
'use strict';

/* ═══ 상수 ═════════════════════════════════ */
const STATUS = { contracted:'계약', candidate:'미정', dropped:'탈락' };
const PAYER = { both:'공동', groom:'신랑', bride:'신부', groomFamily:'신랑 측 가족', brideFamily:'신부 측 가족' };
const METHOD = { card:'카드', cash:'현금', transfer:'계좌이체', other:'기타' };
const PAY_TYPES = ['예약금(계약금)','중도금','잔금','할부','추가금','기타'];
/* 결제자를 신랑 / 신부 / 공동 세 열로 모은다. 양가 부담은 그 쪽 열에 */
const payerCol = p => p==='groom'||p==='groomFamily' ? 'groom' : p==='bride'||p==='brideFamily' ? 'bride' : 'both';
const SIDE = { groom:'신랑', bride:'신부' };
const DEF_RELS = ['가족','친척','친구','직장','지인'];
const DEF_RATE = { '가족':95, '친척':80, '친구':75, '직장':60, '지인':50 };
const DEF_AVG  = { '가족':30, '친척':15, '친구':7, '직장':5, '지인':5 };
const KINDS = { contract:'계약서', audio:'음악', video:'영상', image:'사진', doc:'문서', other:'기타' };
const TRIP_TYPES = { flight:'항공', hotel:'숙소', tour:'투어·액티비티', transport:'교통·렌터카', insurance:'보험·유심', etc:'기타' };
const CURRENCIES = ['USD','EUR','JPY','THB','VND','PHP','IDR','MYR','SGD','AUD','NZD','GBP','CHF','HKD','TWD','CAD','MXN','TRY','AED','MVR','CZK','HUF'];
const DEF_TAGS = ['헤어','메이크업','드레스','신랑 예복','부케','촬영 컨셉','장소/배경','본식 데코','청첩장'];
/* 역산 준비 가이드. months = 예식일 몇 개월 전까지 끝낼 것. 기획 노트의 D-12~D-7 구간 그대로. */
const GUIDE = [
  { g:'예식장 (D-12~10개월)', months:10, cat:'venue', items:['예식장 투어 3곳 이상','식대·보증인원·대관료 비교','예식장 계약'] },
  { g:'스드메 (D-10~8개월)', months:8, cat:'studio', items:['플래너 쓸지 결정','스튜디오 고르기','드레스샵 투어','헤어·메이크업 예약'] },
  { g:'촬영·예물·신혼여행 (D-6~4개월)', months:4, cat:'snap', items:['웨딩 촬영','예물 맞추기','예복 맞추기','신혼여행 항공·숙소','상견례'] },
  { g:'청첩장·가봉 (D-3~2개월)', months:2, cat:'invitation', items:['청첩장 디자인·주문','모바일 청첩장','하객 명단 정리','드레스 가봉','본식 스냅 예약'] },
  { g:'식순·잔금 (D-1개월)', months:1, cat:'etc', items:['식순 확정','사회자·축가 섭외','입장곡·퇴장곡 파일 전달','잔금 일정 확인','답례품·식권 준비'] },
  { g:'마지막 주 (D-7)', months:0.25, cat:'etc', items:['보증인원 확정 통보','혼주 의상·동선 확인','축의대 담당 정하기','당일 준비물 챙기기'] }
];
/* 한국식 기본 식순. 시작 시각 하나 + 소요시간 체인 */
const DDAY = [['신부대기실 오픈',60],['혼주 맞이·접수',30],['본식 시작',30],['원판 사진 촬영',20],['식사·하객 인사',60],['폐백',30],['2부·마무리',40]];
const LS = 'wm.v1';

/* ═══ 상태 ═════════════════════════════════ */
const state = {
  view:'home', sub:{ budget:'money', plan:'timeline', guest:'list', more:'menu', trip:'plan' },
  plan:null, settings:{}, categories:[], vendors:[], payments:[], events:[], tasks:[], guests:[], memos:[],
  files:[], refTags:[], refFileTags:[], refLikes:[], members:[], invites:[], usage:0, quota:0,
  user:null, admin:false, mode:'local', filesOn:false, kakao:false, loading:true, openCat:null, refTag:'all', refWho:'all', guestF:'all', month:null, admData:null, fx:null
};
const COLS = ['vendors','payments','events','tasks','guests','memos'];

/* ═══ 헬퍼 ═════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = Number(String(v==null?'':v).replace(/[^\d.-]/g,'')); return isFinite(n) ? n : 0; };
const won = n => Math.round(Number(n)||0).toLocaleString('ko-KR');
const man = n => { n = Math.round((Number(n)||0)/10000); if (Math.abs(n) >= 10000) { const e = Math.floor(n/10000), r = n%10000; return e+'억'+(r?' '+r.toLocaleString('ko-KR')+'만':''); } return n.toLocaleString('ko-KR')+'만'; };
const today = () => { const d = new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); };
const p2 = n => String(n).padStart(2,'0');
const fmtD = d => d ? (d.length===7 ? d.replace('-','.')+'월' : d.slice(5).replace('-','.')) : '';
const fmtB = n => n>=1073741824 ? (n/1073741824).toFixed(1)+'GB' : n>=1048576 ? Math.round(n/1048576)+'MB' : Math.round(n/1024)+'KB';
const days = d => { if (!d) return null; const t = new Date((d.length===7?d+'-01':d)+'T00:00:00'); return Math.ceil((t - new Date(today()+'T00:00:00'))/864e5); };
const addMonths = (iso, m) => { const d = new Date(iso+'T00:00:00'); const whole = Math.floor(m); d.setMonth(d.getMonth()-whole); d.setDate(d.getDate()-Math.round((m-whole)*30)); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); };
const catName = id => (state.categories.find(c=>c.id===id)||{}).name || id || '기타';
const vendorOf = id => state.vendors.find(v=>v.id===id);
const nameOf = e => { const m = state.members.find(x=>x.email===e); return m ? m.name : (e||'').split('@')[0]; };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function arm(btn, ask){ if (btn.dataset.armed) return true; btn.dataset.armed='1'; const old=btn.textContent; btn.textContent=ask||'한 번 더 누르면 지웁니다'; setTimeout(()=>{ delete btn.dataset.armed; btn.textContent=old; },2500); return false; }
function vendorTotal(v){ const base = v.amountMode==='formula' ? num(v.unitPrice)*num(v.qty)+num(v.extra) : num(v.amount); return base + (v.extras||[]).reduce((s,x)=>s+num(x.amount),0); }
function paidOf(vid){ return state.payments.filter(p=>p.vendorId===vid && p.paidAt).reduce((s,p)=>s+num(p.amount),0); }
function rels(){ return state.settings.rels && state.settings.rels.length ? state.settings.rels : DEF_RELS; }
function filesOf(owner, id){ return state.files.filter(f=>f.owner===owner && f.ownerId===id); }
/* 환율: state.fx.rates 는 1 KRW 당 외화. 외화 1 단위 = 1/rate 원 */
function krwPer(cur){ const r = state.fx && state.fx.rates && state.fx.rates[cur]; return r ? 1/r : null; }
function toKrw(amount, cur){ const k = krwPer(cur); return k ? Math.round(num(amount)*k) : null; }
async function loadFx(){ if (state.fx || state.mode!=='api') return; state.fx = { loading:true }; try { state.fx = await store.call('GET','/api/fx'); render(); } catch(e){ state.fx = { error:e.message }; render(); } }
function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return '링크'; } }
function normUrl(u){ u=String(u||'').trim(); if (!u) return ''; if (!/^https?:\/\//i.test(u)) u='https://'+u; try { return new URL(u).href; } catch(e){ return ''; } }
function kindOf(mime, name){ if (/^audio\//.test(mime)) return 'audio'; if (/^video\//.test(mime)) return 'video'; if (/^image\//.test(mime)) return 'image'; if (/pdf|hwp|msword|officedocument/.test(mime) || /\.(pdf|hwp|docx?)$/i.test(name)) return 'doc'; return 'other'; }

/* 예산 집계: 카테고리별 예산 / 예상 / 확정 / 지출
 * 확정 = 계약 업체 금액 합. 예상 = 확정 + (계약이 없는 카테고리면 미정 업체 중 가장 큰 금액). 탈락은 제외.
 * 지출 = 결제 완료된 금액 합. */
function budgetRows(){
  const cats = state.categories.length ? state.categories : [{id:'etc',name:'기타'}];
  const rows = cats.map(c => {
    const vs = state.vendors.filter(v=>(v.category||'etc')===c.id);
    const con = vs.filter(v=>v.status==='contracted'), cand = vs.filter(v=>v.status==='candidate');
    const fixed = con.reduce((s,v)=>s+vendorTotal(v),0);
    const expect = fixed + (con.length ? 0 : Math.max(0, ...cand.map(vendorTotal), 0));
    const spent = vs.reduce((s,v)=>s+paidOf(v.id),0);
    const by = { groom:0, bride:0, both:0 };
    vs.forEach(v => state.payments.filter(p=>p.vendorId===v.id && p.paidAt).forEach(p => { by[payerCol(p.payer)] += num(p.amount); }));
    const budget = num((state.settings.catBudget||{})[c.id]);
    return { id:c.id, name:c.name, budget, expect, fixed, spent, remain: Math.max(0, fixed - spent), by, vendors:vs };
  });
  const sum = k => rows.reduce((s,r)=>s+r[k],0);
  const byAll = { groom: rows.reduce((s,r)=>s+r.by.groom,0), bride: rows.reduce((s,r)=>s+r.by.bride,0), both: rows.reduce((s,r)=>s+r.by.both,0) };
  return { rows, total:{ budget:num(state.settings.budget)||sum('budget'), expect:sum('expect'), fixed:sum('fixed'), spent:sum('spent'), remain:sum('remain'), by:byAll } };
}
function stageNow(){
  const d = days(state.settings.weddingDate); if (d==null) return '예식일을 정하면 단계가 보여요';
  if (d < 0) return '결혼식 후'; if (d <= 7) return '마지막 주'; if (d <= 31) return '식순·잔금 구간'; if (d <= 92) return '청첩장·가봉 구간';
  if (d <= 184) return '촬영·예물·신혼여행 구간'; if (d <= 305) return '스드메 구간'; return '예식장 구간';
}

/* ═══ 저장소: 서버가 있으면 API, 없으면 브라우저 ═══ */
const store = {
  loadLocal(){ try { const d = JSON.parse(localStorage.getItem(LS)||'null'); if (d) { for (const k of [...COLS,'settings','refTags','refFileTags','refLikes','categories']) if (d[k]) state[k]=d[k]; } } catch(e){} },
  saveLocal(){ if (state.mode!=='local') return; try { const d={}; for (const k of [...COLS,'settings','refTags','refFileTags','refLikes','categories']) d[k]=state[k]; localStorage.setItem(LS, JSON.stringify(d)); } catch(e){} },
  async connect(){
    try {
      const r = await fetch('/api/me', { credentials:'same-origin', headers:{accept:'application/json'} });
      if (r.status===401) { const j = await r.json().catch(()=>null); if (j && j.login) { location.href=j.login; return; } }
      if (r.ok && /json/.test(r.headers.get('content-type')||'')) {
        const me = await r.json();
        state.mode='api'; state.user=me; state.admin=!!me.admin; state.filesOn=!!me.files; state.kakao=!!me.kakao;
        try { localStorage.removeItem(LS); } catch(e){}
        await this.pull();
        addEventListener('focus', ()=>{ if (!$('#sheet').hidden) return; this.pull().catch(()=>{}); });
        return;
      }
    } catch(e){}
    if (!state.categories.length) state.categories = [['venue','예식장'],['planner','플래너'],['studio','스튜디오'],['dress','드레스'],['makeup','헤어/메이크업'],['snap','스냅/영상'],['ceremony','본식'],['ring','예물(반지)'],['suit','예복'],['parents','혼주'],['invitation','청첩장/답례품'],['gathering','청첩장 모임'],['honeymoon','신혼여행'],['etc','기타']].map(([id,name],i)=>({id,name,sort:i}));
    state.loading=false; render();
  },
  async pull(){
    const s = await this.call('GET','/api/state');
    state.plan=s.plan; state.settings=s.plan.settings||{}; state.members=s.members; state.invites=s.invites;
    for (const k of COLS) state[k]=s[k]||[];
    state.files=s.files||[]; state.refTags=s.refTags||[]; state.refFileTags=s.refFileTags||[]; state.refLikes=s.refLikes||[];
    state.categories=s.categories||[]; state.usage=s.usage||0; state.quota=s.quota||0;
    state.loading=false; render();
  },
  async call(method, path, body, raw){
    const o = { method, credentials:'same-origin', headers:{} };
    if (body!==undefined && !raw) { o.headers['content-type']='application/json'; o.body=JSON.stringify(body); }
    if (raw) o.body = raw;
    const r = await fetch(path, o);
    if (r.status===401) { location.href='/auth/login'; throw new Error('로그인이 풀렸습니다'); }
    if (!r.ok) { let m='HTTP '+r.status; try { m=(await r.json()).error||m; } catch(e){} throw new Error(m); }
    return r.json();
  },
  /* 낙관적 갱신: 화면 먼저, 서버는 뒤에. 실패하면 다시 당겨 온다. */
  async put(col, item){
    const arr = state[col]; const i = arr.findIndex(x=>x.id===item.id); if (i>=0) arr[i]=item; else arr.push(item);
    render();
    if (state.mode==='api') { try { await this.call('PUT','/api/'+col+'/'+item.id, item); } catch(e){ toast(e.message); this.pull().catch(()=>{}); } }
    else this.saveLocal();
  },
  async putMany(col, items){
    for (const it of items) { const i = state[col].findIndex(x=>x.id===it.id); if (i>=0) state[col][i]=it; else state[col].push(it); }
    render();
    if (state.mode==='api') { try { await this.call('PUT','/api/'+col, {items}); } catch(e){ toast(e.message); } }
    else this.saveLocal();
  },
  async del(col, id){
    state[col] = state[col].filter(x=>x.id!==id);
    if (col==='vendors') { state.payments = state.payments.filter(p=>p.vendorId!==id); state.events = state.events.filter(e=>e.vendorId!==id); }
    render();
    if (state.mode==='api') { try { await this.call('DELETE','/api/'+col+'/'+id); } catch(e){ toast(e.message); } }
    else this.saveLocal();
  },
  async settingsPatch(patch, quiet){
    state.settings = Object.assign({}, state.settings, patch); render();
    if (state.mode==='api') { try { await this.call('PUT','/api/plan', patch); } catch(e){ toast(e.message); } }
    else this.saveLocal();
    if (!quiet) toast('저장됨');
  }
};

/* ═══ 그리기 ═══════════════════════════════ */
function render(){
  document.querySelectorAll('#tabs [data-view]').forEach(b => b.setAttribute('aria-current', b.dataset.view===state.view ? 'page' : 'false'));
  $('#me').innerHTML = state.user ? esc(state.user.name) + '<br><span class="small">' + esc(state.plan ? state.plan.name : '') + '</span>' : '<span class="small">이 기기에만 저장 중</span>';
  const v = $('#view');
  if (state.loading) { v.innerHTML = '<p class="muted" style="padding:40px 0;text-align:center">불러오는 중…</p>'; return; }
  paintHelper();

function toMin(t){ const m = String(t||'').match(/^(\d{1,2}):(\d{2})$/); return m ? Number(m[1])*60+Number(m[2]) : 600; }
function fromMin(m){ return p2(Math.floor(m/60)%24)+':'+p2(m%60); }
function renderMonth(){
  const base = state.month || today().slice(0,7);
  const [y,m] = base.split('-').map(Number);
  const first = new Date(y, m-1, 1), start = new Date(first); start.setDate(1-first.getDay());
  const marks = {};
  const add = (d, cls, label) => { if (!d) return; (marks[d] = marks[d] || []).push({cls, label}); };
  if (state.settings.weddingDate && state.settings.weddingDate.length===10) add(state.settings.weddingDate, 'wed', '결혼식');
  state.events.filter(e=>e.kind!=='dday' && e.date).forEach(e=>add(e.date, e.kind==='trip'?'guide':'fixed', (e.kind==='trip'?'✈ ':'')+e.title));
  state.payments.filter(p=>!p.paidAt).forEach(p=>add(p.dueDate,'pay',(vendorOf(p.vendorId)||{}).name+' '+p.title));
  state.tasks.filter(t=>!t.done).forEach(t=>add(t.due,'guide',t.title));
  let cells = '';
  for (let i=0;i<42;i++) { const d = new Date(start); d.setDate(start.getDate()+i); const iso = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); const ms = marks[iso]||[];
    cells += '<div class="d'+(d.getMonth()!==m-1?' other':'')+(iso===today()?' today':'')+'"><span class="n">'+d.getDate()+'</span>'+ms.slice(0,3).map(x=>'<span class="ev '+x.cls+'" title="'+esc(x.label)+'">'+esc(x.label)+'</span>').join('')+(ms.length>3?'<span class="ev">+'+(ms.length-3)+'</span>':'')+'</div>'; }
  return '<div class="row" style="margin-bottom:10px"><button class="btn sm" data-month="-1">‹</button><b>'+y+'년 '+m+'월</b><button class="btn sm" data-month="1">›</button><span class="muted small right">■ 확정 일정 · <span style="color:var(--warn)">■ 결제일</span> · 회색 가이드 마감</span></div>' +
    '<div class="cal">'+['일','월','화','수','목','금','토'].map(d=>'<div class="dow">'+d+'</div>').join('')+cells+'</div>' +
    '<div class="sect"><h2>확정 일정 추가 <span class="sub">투어 · 가봉 · 상견례 · 촬영</span></h2><div class="inline"><input id="e-date" type="date" style="width:150px"><input id="e-time" type="time" style="width:110px"><input id="e-title" placeholder="일정" style="flex:1;min-width:140px"><select id="e-vendor" style="width:140px"><option value="">업체 연결 없음</option>'+state.vendors.filter(v=>v.status!=='dropped').map(v=>'<option value="'+v.id+'">'+esc(v.name)+'</option>').join('')+'</select><button class="btn" id="addEvent">추가</button></div>' +
    (state.events.filter(e=>e.kind==='event').length?'<div class="list" style="margin-top:10px">'+state.events.filter(e=>e.kind==='event').sort((a,b)=>a.date.localeCompare(b.date)).map(e=>'<div class="it"><div class="t"><b>'+esc(e.title)+'</b><small>'+esc(e.date)+' '+esc(e.time||'')+(e.vendorId&&vendorOf(e.vendorId)?' · '+esc(vendorOf(e.vendorId).name):'')+'</small></div><button class="x" data-delev="'+e.id+'">×</button></div>').join('')+'</div>':'')+'</div>';

async function uploadFile(file, owner, ownerId){
  let blob = file, type = file.type || 'application/octet-stream';
  if (/^image\//.test(type) && owner!=='vendor') { try { blob = await resizeImage(file, 1600, .85); type='image/jpeg'; } catch(e){} }
  const kind = owner==='vendor' && !/^(audio|video)\//.test(type) ? (/^image\//.test(type) ? 'image' : 'contract') : kindOf(type, file.name);
  const q = new URLSearchParams({ owner, id: ownerId||'', kind, name: file.name });
  if (owner==='reference' && (state.refWho==='groom' || state.refWho==='bride')) q.set('who', state.refWho);
  const r = await fetch('/api/files?'+q, { method:'POST', credentials:'same-origin', headers:{'content-type':type}, body:blob });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error||'올리지 못했습니다');
  state.files.unshift(j.file); state.usage = j.usage; return j.file;
}
function resizeImage(file, max, q){
  return new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(u); const sc = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b => b ? res(b) : rej(new Error('변환 실패')), 'image/jpeg', q); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('이미지를 읽지 못했습니다')); }; img.src = u; });
}

/* 스와이프(터치·마우스 드래그), 키보드 화살표, 휠로 넘긴다 */
let swX=null, swY=null, swiped=false, wheelAt=0;
$('#show').addEventListener('pointerdown', e => { swX=e.clientX; swY=e.clientY; });
$('#show').addEventListener('pointerup', e => { if (swX==null) return; const dx=e.clientX-swX, dy=e.clientY-swY; swX=null; if (Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)*1.5) { swiped=true; showStep(dx<0?1:-1); } else if (dy>90 && Math.abs(dy)>Math.abs(dx)*1.5) { swiped=true; closeShow(); } });
$('#show').addEventListener('wheel', e => { const now=Date.now(); if (now-wheelAt<350) return; const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY; if (Math.abs(d)<8) return; wheelAt=now; showStep(d>0?1:-1); e.preventDefault(); }, { passive:false });
document.addEventListener('keydown', e => { if ($('#show').hidden) return; if (e.key==='ArrowRight'||e.key===' ') { showStep(1); e.preventDefault(); } if (e.key==='ArrowLeft') { showStep(-1); e.preventDefault(); } });

function seedGuide(){

const CAT_ALIAS = [[/웨딩홀|예식장|홀/,'venue'],[/플래너/,'planner'],[/스드메|스튜디오/,'studio'],[/드레스/,'dress'],[/메이크업|헤어/,'makeup'],[/스냅|영상|dvd/i,'snap'],[/본식|사회|축가|축의/,'ceremony'],[/예물|반지|밴드/,'ring'],[/예복|수트|정장/,'suit'],[/혼주|한복/,'parents'],[/모임|식사|밥/,'gathering'],[/청첩|답례/,'invitation'],[/신혼여행|허니문/,'honeymoon']];
function importBudget(){
  openSheet('엑셀 가계부 붙여넣기', '<p class="small muted" style="margin-bottom:8px">엑셀에서 표를 복사해 붙여 넣으세요. 열 순서는 <b>카테고리, 항목, 금액, 계약일, 지출금액, 비고</b>입니다. 카테고리 칸이 비면 윗줄 것을 씁니다. 항목마다 업체 하나가 되고, 지출금액이 있으면 완료된 결제로 들어갑니다.</p><textarea id="ib-text" style="width:100%;min-height:240px;padding:10px;border:1px solid var(--line2);border-radius:var(--r);font-size:12.5px" placeholder="웨딩홀\t계약금\t1,000,000\t2027-01-01\t1,000,000\t○○웨딩홀&#10;\t대관료\t5,000,000\t2027-01-01\t\t&#10;\t식대\t15,000,000\t2027-01-01\t\t보증인원 200명"></textarea>', [
    { label:'가져오기', cls:'primary', onClick:()=>{
      let cat='etc', lastCatName=''; const vendors=[], payments=[];
      $('#ib-text').value.split(/\n/).forEach(line => {
        const c = line.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').trim());
        if (c.length < 2) return;
        if (/합계|총\s*금액|총\s*합계/.test(c[0]) || /합계/.test(c[1]||'')) return;
        if (c[0]) { lastCatName=c[0]; const hit = CAT_ALIAS.find(([re])=>re.test(c[0])); cat = hit ? hit[1] : (state.categories.find(x=>x.name===c[0])||{}).id || 'etc'; }
        const name = c[1]; if (!name || /^항목$/.test(name)) return;
        const amount = num(c[2]), date = /\d{4}-\d{2}-\d{2}/.test(c[3]||'') ? c[3].match(/\d{4}-\d{2}-\d{2}/)[0] : '', spent = num(c[4]), memo = [c[5]||'', lastCatName && !state.categories.find(x=>x.id===cat) ? '('+lastCatName+')' : ''].filter(Boolean).join(' ');
        if (!amount && !spent && !memo) return;
        const id = uid();
        vendors.push({ id, name, category:cat, status: amount||date ? 'contracted' : 'candidate', amountMode:'direct', amount, payer:'both', contact:{name:'',phone:''}, memo: memo + (date ? (memo?' · ':'')+'계약일 '+date : ''), links:[], questions:[], extras:[], createdAt:today() });

      });

      closeSheet(); store.putMany('vendors', vendors); if (payments.length) store.putMany('payments', payments); toast(vendors.length+'개 항목을 가져왔습니다. 결제자·수단은 업체에서 고치세요'); } }
  ]);
}

/* 웨딩홀 콤보박스: 자체 마스터 → 카카오 → 추가 요청 */
let venueTimer = null;
/* 금액 칸: 치는 동안 천 단위 쉼표. 숫자(와 소수점)만 남기고 다시 적는다. num() 이 쉼표를 벗기므로 저장 쪽은 그대로. */
function moneyFormat(el){
  const dec = el.dataset.money==='dec';
  let raw = el.value.replace(dec ? /[^\d.]/g : /\D/g, '');
  if (dec) { const i = raw.indexOf('.'); if (i >= 0) raw = raw.slice(0, i+1) + raw.slice(i+1).replace(/\./g,'').slice(0,2); }
  if (!raw) { el.value=''; return; }
  const [ip, fp] = raw.split('.');
  const out = (ip ? Number(ip).toLocaleString('ko-KR') : '0') + (fp !== undefined ? '.'+fp : '');
  if (el.value !== out) { el.value = out; try { el.setSelectionRange(out.length, out.length); } catch(err){} }
}

    try { const r = await store.call('GET','/api/venues?q='+encodeURIComponent(q));
      const li = [...r.items.map(v=>'<div class="it" data-pickvenue=\''+esc(JSON.stringify({id:v.id,name:v.name,hall:v.hall,status:v.status}))+'\' style="cursor:pointer"><div class="t"><b>'+esc(v.name)+'</b><small>'+esc(v.region||'')+' '+esc(v.hall||'')+(v.status==='pending'?' · 검수 대기':'')+'</small></div></div>'),
        ...r.kakao.map(k=>'<div class="it" data-pickvenue=\''+esc(JSON.stringify({kakaoId:k.kakaoId,name:k.name,placeUrl:k.placeUrl}))+'\' style="cursor:pointer"><div class="t"><b>'+esc(k.name)+'</b><small>'+esc(k.address||'')+' · 카카오</small></div></div>')];
      $('#venueList').innerHTML = '<div class="list card" style="padding:0 12px;margin-top:4px">'+(li.join('')||'<p class="muted small" style="padding:8px 0">검색 결과가 없습니다.</p>')+'<div class="it" data-reqvenue style="cursor:pointer;color:var(--pink-ink)">+ "'+esc(q)+'" 직접 등록 요청</div></div>';
    } catch(err){ toast(err.message); }
  }, 250);
});
async function pickVenue(v){
  try { let picked = v;
    if (v.kakaoId) { const r = await store.call('POST','/api/venues',{ kakaoId:v.kakaoId, name:v.name, placeUrl:v.placeUrl, region:$('#st-region').value, hall:$('#st-hall').value }); picked = r.venue; }
    state.settings.venue = { id:picked.id, name:picked.name, hall:$('#st-hall').value.trim()||picked.hall||'', status:picked.status }; $('#st-venue').value = picked.name; $('#venueList').innerHTML='';
    await store.settingsPatch({ venue: state.settings.venue }, true); toast('웨딩홀을 골랐습니다');
  } catch(err){ toast(err.message); }
}
async function requestVenue(){
  try { const r = await store.call('POST','/api/venues',{ name:$('#st-venue').value.trim(), region:$('#st-region').value, hall:$('#st-hall').value }); await pickVenue(r.venue); toast('등록을 요청했습니다. 바로 쓸 수 있고, 관리자가 검수합니다'); } catch(err){ toast(err.message); }
}

/* ═══ 인트로와 시작 ═══════════════════════════ */
/* 비둘기 도우미. 'open' | 'min' | 'never' 를 이 브라우저에 기억한다 */
function helperMode(){ try { return localStorage.getItem('wm.helper') || 'open'; } catch(e){ return 'open'; } }
function setHelper(m){ try { localStorage.setItem('wm.helper', m); } catch(e){} paintHelper(); }
function paintHelper(){
  const h = $('#helper'); const m = helperMode();
  if (state.view!=='home' || m==='never' || guideOn || !$('#sheet').hidden) { h.hidden=true; return; }
  h.hidden=false;
  h.innerHTML = m==='min'
    ? '<button class="mini" id="helperOpen" aria-label="사용 안내 열기"><img src="/art/doveheart.webp" alt=""></button>'
    : '<div class="hc"><button class="x" id="helperMin" aria-label="접어두기">×</button><img src="/art/doveheart.webp" alt=""><b>처음이세요?</b><p>화면 위에서 하나씩 짚어 드려요. 예산 적는 법부터 파트너 초대까지 10단계.</p>' +
      '<div class="row"><button class="btn primary sm" id="helperGuide">사용 안내 보기</button><button class="btn ghost sm" id="helperMin2">접어두기</button><button class="btn ghost sm" id="helperNever" style="color:var(--muted)">다시 보지 않기</button></div></div>';
}
$('#helper').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id==='helperGuide') { openGuide(0); return; }
  if (t.id==='helperOpen') return setHelper('open');
  if (t.id==='helperMin' || t.id==='helperMin2') return setHelper('min');
  if (t.id==='helperNever') { setHelper('never'); toast('더보기 → 사용 안내에서 다시 볼 수 있어요'); }
});
/* 사용 안내: 가입 직후(#guide) 한 번, 더보기·메인에서 언제든. 각 단계가 실제 화면의 요소를 짚는다. */
const GUIDE_STEPS = [
  { view:'home', target:'.hero', title:'홈은 오늘 할 일만', body:'D-day와 지금 단계가 먼저 보여요. 설정에서 예식일과 총예산을 넣으면 예산 게이지와 다가오는 결제가 살아납니다.' },
  { view:'budget', target:'#tabs [data-view="budget"]', title:'예산 = 업체', body:'예산 탭에서 업체를 적습니다. 업체 하나가 예산 항목 하나예요. 후보로 적어 두고 계약하면 상태만 바꾸세요.' },
  { view:'budget', target:'header.ph [data-addvendor]', title:'업체 적기', body:'이 버튼으로 업체를 추가해요. 금액은 직접 쓰거나 단가 × 수량으로. 저장하면 바로 결제(예약금·중도금·잔금)와 질문, 첨부를 적을 수 있어요.' },
  { view:'budget', target:'.segs [data-sub="budget:vendor"]', title:'금액 뷰와 업체 뷰', body:'금액 뷰는 카테고리별 예산·예상·확정·지출·잔금 표, 업체 뷰는 카드예요. 표의 행을 누르면 그 카테고리 업체가 펼쳐집니다.' },
  { view:'plan', target:'#tabs [data-view="plan"]', title:'예식일 역산 준비 순서', body:'일정 탭에서 "준비 가이드 채우기"를 한 번 누르면 D-12개월부터 D-7까지 할 일이 날짜에 맞춰 생겨요.' },
  { view:'plan', sub:['plan','dday'], target:'.segs [data-sub="plan:dday"]', title:'본식 식순', body:'시작 시각과 단계별 소요시간만 적으면 시각이 이어서 계산돼요. 입장곡·식전영상은 단계마다 첨부합니다.' },
  { view:'trip', target:'#tabs [data-view="trip"]', title:'신혼여행', body:'날짜별 일정과 하고 싶은 것, 항공·숙소 예약을 적어요. 예약은 예산의 신혼여행 카테고리에 자동으로 합산되고 환율 환산도 됩니다.' },
  { view:'more', sub:['more','menu'], target:'[data-go="more:ref"]', title:'레퍼런스', body:'헤어·드레스·촬영 컨셉 캡처를 모아 두고, 상담 때 "상담용 보기"로 넘겨 보세요. 신랑용·신부용으로 나눠 둘 수 있어요.' },
  { view:'more', sub:['more','menu'], target:'[data-go="more:files"]', title:'파일함', body:'업체에 붙인 계약서, 식순에 붙인 입장곡과 영상이 여기 모여요. 당일 전달 묶음은 음향팀에 넘길 때 씁니다.' },
  { view:'more', sub:['more','menu'], target:'[data-go="more:share"]', title:'둘이 같이 쓰기', body:'함께하기에서 파트너 초대 링크를 만들어 보내세요. 같은 장부를 둘 다 보고 고칩니다. 이 안내는 더보기에서 다시 볼 수 있어요.', last:'설정에서 시작하기' }
];
let guideIdx = 0, guideOn = false;
function openGuide(i){ guideIdx = i||0; guideOn = true; $('#guide').hidden=false; $('#helper').hidden=true; paintGuide(); }
function closeGuide(){ guideOn=false; $('#guide').hidden=true; try { localStorage.setItem('wm.guide','1'); } catch(e){} paintHelper(); }
function paintGuide(){
  const g = GUIDE_STEPS[guideIdx], last = guideIdx===GUIDE_STEPS.length-1;
  if (state.view!==g.view || (g.sub && state.sub[g.sub[0]]!==g.sub[1])) { state.view=g.view; if (g.sub) state.sub[g.sub[0]]=g.sub[1]; render(); }
  $('#guide').innerHTML = '<div class="spot"></div><svg class="hand" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V11m0-4.5a1.5 1.5 0 0 1 3 0V11m0-3a1.5 1.5 0 0 1 3 0v3m0-1a1.5 1.5 0 0 1 3 0v5.5A6.5 6.5 0 0 1 14.5 22h-2.3a6.5 6.5 0 0 1-5.4-2.9L3.4 14a1.6 1.6 0 0 1 2.6-1.8L9 15" fill="#fff" stroke="#C23A55" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>' +
    '<div class="tip below"><div class="step">사용 안내 '+(guideIdx+1)+' / '+GUIDE_STEPS.length+'</div><h3>'+esc(g.title)+'</h3><p>'+esc(g.body)+'</p>' +
    '<div class="dots">'+GUIDE_STEPS.map((_,i)=>'<i class="'+(i===guideIdx?'on':'')+'"></i>').join('')+'</div>' +
    '<div class="gf"><button class="btn ghost sm" id="gSkip">'+(last?'닫기':'건너뛰기')+'</button>'+(guideIdx>0?'<button class="btn sm right" id="gPrev">이전</button>':'')+'<button class="btn primary sm'+(guideIdx>0?'':' right')+'" id="gNext">'+(last?(g.last||'시작하기'):'다음')+'</button></div></div>';
  requestAnimationFrame(()=>requestAnimationFrame(placeGuide));
}
function placeGuide(){
  if (!guideOn) return;
  const g = GUIDE_STEPS[guideIdx]; const el = document.querySelector(g.target);
  const spot=$('#guide .spot'), hand=$('#guide .hand'), tip=$('#guide .tip'); if (!spot||!tip) return;
  if (!el) { spot.style.display='none'; hand.style.display='none'; tip.className='tip'; tip.style.left='12px'; tip.style.top='auto'; tip.style.bottom='calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px))'; return; }
  let r = el.getBoundingClientRect();
  const navTop = matchMedia('(min-width:900px)').matches ? innerHeight : innerHeight - 66;
  if (r.top < 70 || r.bottom > navTop - 10) { el.scrollIntoView({ block:'center', behavior:'instant' }); r = el.getBoundingClientRect(); }
  const pad = 6; spot.style.display=''; hand.style.display='';
  spot.style.left=(r.left-pad)+'px'; spot.style.top=(r.top-pad)+'px'; spot.style.width=(r.width+pad*2)+'px'; spot.style.height=(r.height+pad*2)+'px';
  hand.style.left=(r.left + Math.min(r.width*0.6, r.width-10))+'px'; hand.style.top=(r.top + r.height*0.55)+'px';
  const tw = Math.min(340, innerWidth-24), th = tip.offsetHeight || 190;
  const below = r.bottom + 14 + th < navTop - 8;
  let left = Math.max(12, Math.min(innerWidth - tw - 12, r.left + r.width/2 - tw/2));
  tip.className = 'tip ' + (below ? 'below' : 'above');
  tip.style.left = left+'px'; tip.style.bottom='auto';
  tip.style.top = (below ? r.bottom + 14 : Math.max(12, r.top - 14 - th)) + 'px';
  tip.style.setProperty('--ax', Math.max(16, Math.min(tw-30, r.left + r.width/2 - left - 7))+'px');
}
addEventListener('resize', ()=>{ if (guideOn) placeGuide(); });
$('#guide').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id==='gSkip') closeGuide();
  if (t.id==='gNext') { if (guideIdx>=GUIDE_STEPS.length-1) { closeGuide(); state.view='more'; state.sub.more='settings'; render(); window.scrollTo(0,0); } else { guideIdx++; paintGuide(); } }
  if (t.id==='gPrev') { guideIdx=Math.max(0,guideIdx-1); paintGuide(); }
});
function maybeGuide(delay){
  if (location.hash==='#guide') { history.replaceState(null,'',location.pathname); setTimeout(()=>openGuide(0), delay==null ? 3800 : delay); }
}
addEventListener('hashchange', ()=>maybeGuide(0));   // 같은 문서에서 #guide 로 바뀌어도 열린다
function playIntro(force){
  let seen = false; try { seen = localStorage.getItem('wm.intro')===today(); if (!force) localStorage.setItem('wm.intro', today()); } catch(e){}
  if ((seen && !force) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el = $('#intro'); el.hidden=false; el.classList.remove('out');
  const imgs = el.querySelectorAll('img'); imgs.forEach(i => { i.style.animation='none'; void i.offsetWidth; i.style.animation=''; });
  const end = () => { el.classList.add('out'); setTimeout(()=>{ el.hidden=true; }, 450); };
  setTimeout(end, 3600); el.addEventListener('click', end, { once:true });
}
playIntro(false); maybeGuide();
try { console.info('%cWedding Management%c  © 2026 myoung · 무단 사용 금지', 'color:#C23A55;font-weight:700', 'color:#9C868C'); } catch(e){}
store.loadLocal(); render(); store.connect();
})();
</script>
